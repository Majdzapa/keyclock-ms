
spring.application.name=certmanager

# --- Server ---
server.port=8081

# --- DataSource (MariaDB) ---
spring.datasource.url=jdbc:mariadb://localhost:3306/certmanager
spring.datasource.username=certuser
spring.datasource.password=certpassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- OAuth2 Resource Server (Keycloak) ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:8080/realms/certmanager-realm/protocol/openid-connect/certs

# --- Spring Mail (Mailpit) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.incert.certmanager=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE



# Scheduler: every hour at :00
app.scheduler.cron=0 0 * * * *
app.scheduler.expiry-threshold-hours=72

# Notification
app.notification.from=noreply@certmanager.local
app.notification.admin-email=admin@certmanager.local
app.notification.enabled=true

# Remote certificate fetch timeout (milliseconds)
app.certificate.remote-fetch-timeout-ms=10000
app.certificate.allowed-extensions=pem,crt,cer,p12,pfx

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173