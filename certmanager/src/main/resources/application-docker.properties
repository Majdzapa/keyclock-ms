# ===========================================================
# CertManager — Docker Profile Overrides
# ===========================================================

# Override datasource to point to Docker service name
spring.datasource.url=jdbc:mariadb://mariadb:3306/certmanager
spring.datasource.username=certuser
spring.datasource.password=certpassword

# Override Keycloak endpoints to Docker service name
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/certmanager-realm/protocol/openid-connect/certs

# Override Mail to Mailpit Docker service
spring.mail.host=mailpit
spring.mail.port=1025

# Reduced logging in Docker
logging.level.com.incert.certmanager=INFO
logging.level.org.hibernate.SQL=WARN
