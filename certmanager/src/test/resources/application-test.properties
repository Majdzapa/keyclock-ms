# Test configuration — uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests — JPA creates schema
spring.flyway.enabled=false

# Mock OAuth2 — override with @WithMockUser in tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/test

# Disable mail in tests
app.notification.enabled=false
spring.mail.host=localhost
spring.mail.port=1025